spring:
  application:
    name: paint-quality-server
  datasource:
    url: "jdbc:h2:file:${APP_DATA_DIR:./data}/paint-quality;DB_CLOSE_ON_EXIT=FALSE"
    driver-class-name: org.h2.Driver
    username: sa
    password: ${APP_DB_PASSWORD:}
    hikari:
      maximum-pool-size: 10
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Shanghai
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  jackson:
    time-zone: Asia/Shanghai

server:
  port: ${PORT:8080}

app:
  data-dir: ${APP_DATA_DIR:./data}
  zone-id: ${APP_ZONE_ID:Asia/Shanghai}
  token-validity-days: ${APP_TOKEN_VALIDITY_DAYS:90}
  cleanup-cron: ${APP_CLEANUP_CRON:0 0 1 * * *}
  bootstrap-admin:
    name: ${APP_BOOTSTRAP_ADMIN_NAME:admin}
    area: ${APP_BOOTSTRAP_ADMIN_AREA:ADMIN}

logging:
  level:
    root: INFO
